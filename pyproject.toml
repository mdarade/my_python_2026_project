[project]
name = "my-python-2026-project"
version = "0.1.0"
description = "Python project template with uv, Ruff, mypy, and pytest."
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
hello = "my_python_2026_project.main:main"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "RUF",     # ruff-specific
]

# ---------- mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests"]

# ---------- pytest / coverage ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov=my_python_2026_project", "--cov-report=term-missing"]

[tool.coverage.report]
fail_under = 80
